      .white { fill: #f7f9ff; }
      .muted { fill: #b3c3df; }
      .ink { fill: #17233d; }
      .small { font-size: 21px; }
      .body { font-size: 24px; }
      .label { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
      .heading { font-size: 30px; font-weight: 700; }
      .center { text-anchor: middle; }
      .wire { fill: none; stroke: #a6b9dd; stroke-width: 2.5; marker-end: url(#arrow); }
      .both { marker-start: url(#reverse-arrow); }
    </style>
  </defs>

