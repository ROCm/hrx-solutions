<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1536" viewBox="0 0 1600 1536" role="img" aria-labelledby="title description">
  <title id="title">HRX platform architecture</title>
  <desc id="description">Loom-C++ source, Loom ASM text, and Loom Bytecode feed a shared Loom IR with High and Low forms. Linking, specialization, optimization, lowering, scheduling, and register allocation produce AMDGCN GPU, XDNA NPU, and x86 CPU executables. The Loom-C API provides access to modules, serialization, compilation, and JIT embedding. Executables and the libhrx and HIP APIs meet at the HRX runtime, with executable loading, asynchronous execution, and memory management. Pluggable GPU, NPU, and CPU HAL modules connect the runtime to AMD hardware.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101b36"/>
      <stop offset="1" stop-color="#080f20"/>
    </linearGradient>
    <linearGradient id="compiler" x2="1" y2="0">
      <stop stop-color="#754bdb"/>
      <stop offset="1" stop-color="#4e40a6"/>
    </linearGradient>
    <linearGradient id="runtime" x2="1" y2="0">
      <stop stop-color="#164e92"/>
      <stop offset="1" stop-color="#12386b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#a6b9dd"/>
    </marker>
    <marker id="reverse-arrow" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 9 1 L 1 5 L 9 9 Z" fill="#a6b9dd"/>
    </marker>
    <style>
