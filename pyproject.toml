[build-system]
requires = [
  "setuptools>=77",
  "wheel>=0.45",
]
build-backend = "setuptools.build_meta"

[project]
name = "hrx-solutions"
dynamic = ["version"]
description = "Loom Serve application built on the HRX runtime"
readme = {file = "PYPI_README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "The HRX Authors"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
loom-hem = "hrx_solutions.hem_cli:main"
loom-serve = "hrx_solutions.loom_serve:main"

[project.urls]
Homepage = "https://github.com/ROCm/hrx-solutions"
Repository = "https://github.com/ROCm/hrx-solutions"

[tool.setuptools]
packages = ["hrx_solutions"]

[tool.setuptools.package-dir]
hrx_solutions = "binding/python"

[tool.setuptools.package-data]
hrx_solutions = ["pi_extension/*.ts", "pi_extension/*.json"]
