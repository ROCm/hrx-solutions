[build-system]
requires = [
  "setuptools>=77",
  "wheel>=0.45",
]
build-backend = "setuptools.build_meta"

[project]
name = "hrx-solutions"
dynamic = ["version"]
description = "Loom Serve application built on the HRX runtime"
readme = {file = "PYPI_README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
dependencies = ["textual>=0.47,<2"]
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "The HRX Authors"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
moonshine = ["huggingface-hub==2.2.0; python_version >= '3.12'", "safetensors==0.8.0; python_version >= '3.12'"]

[project.scripts]
loom-control = "hrx_solutions.hem_cli:main"
loom-serve = "hrx_solutions.loom_serve:main"

[project.urls]
Homepage = "https://github.com/ROCm/hrx-solutions"
Repository = "https://github.com/ROCm/hrx-solutions"

[tool.setuptools]
packages = ["hrx_solutions", "hrx_solutions.models", "hrx_solutions.cli", "hrx_solutions.tui", "hrx_solutions.integrations", "hrx_solutions.integrations.omp"]

[tool.setuptools.package-dir]
hrx_solutions = "binding/python"

[tool.setuptools.package-data]
hrx_solutions = ["native_protocol.ts", "omp_extension/index.ts", "omp_extension/installation.ts", "omp_extension/activation.ts", "omp_extension/discovery.ts", "omp_extension/stream.ts", "omp_extension/profile.json", "omp_extension/package.json", "pi_extension/*.ts", "pi_extension/*.json", "opencode_plugin/index.ts", "opencode_plugin/discovery.ts", "opencode_plugin/installation.ts", "opencode_plugin/profile.json", "opencode_plugin/package.json"]
