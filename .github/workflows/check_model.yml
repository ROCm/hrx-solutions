name: Check Loom Control dynamic model lifecycle

on:
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  model:
    name: Test Loom Control 0.8B lifecycle (gfx1151)
    runs-on: linux-gfx1151-gpu-rocm
    timeout-minutes: 20
    # Matches the successful gfx1151 configuration in ROCm/hrx-system ci_iree.yml.
    container:
      image: ghcr.io/rocm/no_rocm_image_ubuntu24_04@sha256:4150afe4759d14822f0e3f8930e1124f26e11f68b5c7b91ec9a02b20b1ebbb98
      options: >-
        --init
        --ipc host --group-add video --device /dev/kfd --device /dev/dri
        --group-add 993 --group-add 992 --group-add 110 --ulimit memlock=-1:-1
        --security-opt seccomp=unconfined
        --env-file /etc/podinfo/gha-gpu-isolation-settings --user 0:0
    defaults:
      run:
        shell: bash
    steps:
      - name: Install test prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv curl ca-certificates git npm
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install ROCm diagnostic tool
        run: bash .github/scripts/install_rocminfo.sh
      - name: Check gfx1151 with rocminfo
        timeout-minutes: 2
        run: |
          mkdir -p build
          timeout --kill-after=10s 60s /opt/rocm-7.2.4/bin/rocminfo 2>&1 | tee build/rocminfo.log
          tail -c 65536 build/rocminfo.log > build/rocminfo-tail.log
          grep -Eq 'Name:[[:space:]]+gfx1151([[:space:]]|$)' build/rocminfo.log
      - name: Download repaired wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: hrx-solutions-wheel-linux-x86_64
          path: ${{ runner.temp }}/model-wheel
      - name: Stage qualified Pi runtime for generated-configuration smoke
        run: bash build_tools/stage-pi-runtime.sh "${RUNNER_TEMP}/pi-runtime"
      - name: Stage qualified OpenCode 2 runtime for generated-configuration smoke
        run: bash build_tools/stage-opencode-runtime.sh "${RUNNER_TEMP}/opencode-runtime"
      - name: Stage qualified OMP runtime for generated-configuration smoke
        run: bash build_tools/stage-omp-runtime.sh "${RUNNER_TEMP}/omp-runtime"
      - name: Qualify pinned 0.8B with Loom Control and generated Pi/OMP/OpenCode configuration
        env:
          LOOM_PI_RUNTIME: ${{ runner.temp }}/pi-runtime
          LOOM_OPENCODE_RUNTIME: ${{ runner.temp }}/opencode-runtime
          LOOM_OMP_RUNTIME: ${{ runner.temp }}/omp-runtime
          HF_HUB_CACHE: ${{ runner.temp }}/huggingface/hub
        run: |
          shopt -s nullglob
          wheels=("${RUNNER_TEMP}/model-wheel/"*.whl)
          test "${#wheels[@]}" -eq 1
          bash build_tools/model-smoke.sh "${wheels[0]}" "${RUNNER_TEMP}/model-diagnostics"
      - name: Collect bounded diagnostics
        if: always()
        run: |
          mkdir -p build/model-diagnostics
          if [[ -d "${RUNNER_TEMP}/model-diagnostics/lifecycle/diagnostics" ]]; then
            cp -a "${RUNNER_TEMP}/model-diagnostics/lifecycle/diagnostics/." build/model-diagnostics/
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-smoke-diagnostics
          # Relative paths avoid host/container translation of only the first
          # entry in this multi-line action input.
          path: |
            build/rocminfo-tail.log
            build/model-diagnostics/*
          if-no-files-found: warn

  openwebui:
    name: Test generated Open WebUI configuration (gfx1151 host networking)
    needs: model
    runs-on: linux-gfx1151-gpu-rocm
    timeout-minutes: 20
    # A host job is required: the owned WebUI container and native inference
    # processes share host loopback. Do not mount a Docker socket into model.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download the same repaired wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: hrx-solutions-wheel-linux-x86_64
          path: ${{ runner.temp }}/webui-wheel
      - name: Qualify generated WebUI wiring with immutable local 0.8B assets
        env:
          MODEL08_DIRECTORY: ${{ vars.LOOM_MODEL08_DIRECTORY }}
          HRX_LOCAL_CI_CLEANUP_FILE: ${{ runner.temp }}/webui-cleanup.json
        run: |
          docker info --format '{{.ServerVersion}}'
          shopt -s nullglob
          wheels=("${RUNNER_TEMP}/webui-wheel/"*.whl)
          test "${#wheels[@]}" -eq 1
          fixture=${MODEL08_DIRECTORY:-"$HOME/Downloads/gguf/models/multimodal/qwen/qwen3.5-0.8b"}
          test -f "$fixture/Qwen3.5-0.8B-UD-Q5_K_XL.gguf"
          test -f "$fixture/tokenizer.json"
          bash build_tools/model-smoke.sh --openwebui "${wheels[0]}" "${RUNNER_TEMP}/webui-diagnostics" "$fixture"
      - name: Upload bounded WebUI diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openwebui-configuration-diagnostics
          # Never upload private runtime/data directories or credential files.
          path: |
            ${{ runner.temp }}/webui-diagnostics/lifecycle/results.json
            ${{ runner.temp }}/webui-diagnostics/webui-image.log
            ${{ runner.temp }}/webui-cleanup.json
          if-no-files-found: warn
