name: Build and check Python wheel

on:
  workflow_call:
    inputs:
      name:
        type: string
        default: Build and check wheel (manylinux x86-64)
      release_type:
        type: string
        default: nightly
      run_id:
        type: string
        default: ""
      use_bazel_cache:
        type: boolean
        default: false # Enable after compiler tracking and integrated local gates pass.
      cache_write_pilot:
        type: boolean
        default: false
        description: Allow an explicit trusted manual pilot-branch run to seed the pilot cache.
      artifact_set:
        type: string
        default: core
    outputs:
      cache_attempted_key:
        description: Attempted publication key; cleanup must independently verify publication.
        value: ${{ jobs.build_python_wheel.outputs.cache_attempted_key }}

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build_python_wheel:
    name: ${{ inputs.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      cache_attempted_key: ${{ steps.cache_publication.outputs.key }}
    env:
      PYTHONNOUSERSITE: "1"
      CACHE_FAMILY: ${{ github.ref == 'refs/heads/pilot/wheel-bazel-cache' && 'wheel-bazel-pilot-v1-linux-x86_64-' || 'wheel-bazel-v1-linux-x86_64-' }}
      CACHE_KEY: ${{ github.ref == 'refs/heads/pilot/wheel-bazel-cache' && 'wheel-bazel-pilot-v1-linux-x86_64-' || 'wheel-bazel-v1-linux-x86_64-' }}${{ github.run_id }}-${{ github.run_attempt }}-manylinux-${{ inputs.artifact_set }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Python test requirements
        run: |
          env -u PYTHONPATH -u PYTHONHOME python3 -m venv "${RUNNER_TEMP}/hem-source-venv"
          env -u PYTHONPATH -u PYTHONHOME "${RUNNER_TEMP}/hem-source-venv/bin/python" -m build_tools.ci_tools.source_tests install
      - name: Stage and check source UI integrations
        run: |
          bash build_tools/stage-pi-runtime.sh "${RUNNER_TEMP}/pi-runtime"
          bash build_tools/stage-opencode-runtime.sh "${RUNNER_TEMP}/opencode-runtime"
          bash build_tools/stage-omp-runtime.sh "${RUNNER_TEMP}/omp-runtime"
          bash build_tools/check-pi-assets.sh "${RUNNER_TEMP}/pi-runtime" binding/python/pi_extension
          bash build_tools/check-opencode-assets.sh "${RUNNER_TEMP}/opencode-runtime" binding/python/opencode_plugin
          bash build_tools/check-omp-assets.sh "${RUNNER_TEMP}/omp-runtime" binding/python/omp_extension
      - name: Run Python unit tests
        # Source contracts and released client loaders must run together.
        env:
          LOOM_SERVE_DIR: ${{ runner.temp }}/hem-source-state
          LOOM_OPENCODE_TEST_NODE: ${{ runner.temp }}/opencode-runtime/node-v24.10.0-linux-x64/bin/node
          LOOM_OMP_TEST_BUN: ${{ runner.temp }}/omp-runtime/runtime/node_modules/.bin/bun
          LOOM_OMP_TEST_PACKAGE: ${{ runner.temp }}/omp-runtime/client/node_modules/@oh-my-pi/pi-coding-agent
        run: |
          # Unit-test fixtures must not inherit the enclosing CI run's identity.
          unset PYTHONPATH PYTHONHOME GITHUB_RUN_ID GITHUB_RUN_ATTEMPT
          python="${RUNNER_TEMP}/hem-source-venv/bin/python"
          "$python" -m build_tools.ci_tools.source_tests verify
          "$python" -m build_tools.ci_tools.source_tests build_tools
          "$python" -m build_tools.ci_tools.source_tests tests
      - name: Start cache measurements
        if: inputs.use_bazel_cache
        continue-on-error: true
        run: |
          mkdir -p "${RUNNER_TEMP}/wheel-cache-diagnostics"
          date +%s > "${RUNNER_TEMP}/wheel-cache-diagnostics/restore.started"
      - name: Restore optional Bazel action cache
        id: cache_restore
        if: inputs.use_bazel_cache
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/hrx-wheel-bazel-cache
          key: ${{ env.CACHE_KEY }}
          restore-keys: ${{ env.CACHE_FAMILY }}
          fail-on-cache-miss: false
          enableCrossOsArchive: false
      - name: Prepare optional Bazel action cache
        id: cache_prepare
        if: inputs.use_bazel_cache
        continue-on-error: true
        env:
          HRX_BAZEL_CACHE_DIR: ${{ runner.temp }}/hrx-wheel-bazel-cache
          RESTORE_OUTCOME: ${{ steps.cache_restore.outcome }}
          MATCHED_KEY: ${{ steps.cache_restore.outputs.cache-matched-key }}
        run: |
          unset PYTHONPATH PYTHONHOME
          state=fresh
          if [[ "$RESTORE_OUTCOME" != success ]]; then
            state=failed
          elif [[ -n "$MATCHED_KEY" ]]; then
            state=restored
          fi
          "${RUNNER_TEMP}/hem-source-venv/bin/python" build_tools/wheel_cache.py prepare \
            --directory "$HRX_BAZEL_CACHE_DIR" --restore-state "$state" | tee "${RUNNER_TEMP}/wheel-cache-diagnostics/prepare.json"
          echo "$(( $(date +%s) - $(cat "${RUNNER_TEMP}/wheel-cache-diagnostics/restore.started") ))" > "${RUNNER_TEMP}/wheel-cache-diagnostics/restore.seconds"
      - name: Build and repair wheel in manylinux container
        env:
          HRX_BAZEL_CACHE_DIR: ${{ runner.temp }}/hrx-wheel-bazel-cache
          HRX_BAZEL_CACHE_ENABLED: ${{ steps.cache_prepare.outputs.enabled == 'true' && '1' || '0' }}
          HRX_RELEASE_TYPE: ${{ inputs.release_type }}
          HRX_RUN_ID: ${{ inputs.run_id }}
          HRX_ARTIFACT_SET: ${{ inputs.artifact_set }}
        run: |
          SECONDS=0
          bash build_tools/build-wheel.sh
          if [[ -d "${RUNNER_TEMP}/wheel-cache-diagnostics" ]]; then
            echo "$SECONDS" > "${RUNNER_TEMP}/wheel-cache-diagnostics/build.seconds" || true
          fi
      - name: Check wheel installation on Ubuntu host
        env:
          LOOM_OMP_TEST_BUN: ${{ runner.temp }}/omp-runtime/runtime/node_modules/.bin/bun
          LOOM_OMP_TEST_PACKAGE: ${{ runner.temp }}/omp-runtime/client/node_modules/@oh-my-pi/pi-coding-agent
        run: |
          SECONDS=0
          shopt -s nullglob
          wheels=(build/wheel/wheelhouse/*.whl)
          test "${#wheels[@]}" -eq 1
          bash build_tools/check-wheel.sh "${wheels[0]}" "${RUNNER_TEMP}/wheel-install-venv"
          if [[ -d "${RUNNER_TEMP}/wheel-cache-diagnostics" ]]; then
            echo "$SECONDS" > "${RUNNER_TEMP}/wheel-cache-diagnostics/validation.seconds" || true
          fi
      - name: Check installed UI integrations from the repaired wheel
        run: |
          bash build_tools/check-ui-integrations.sh "${RUNNER_TEMP}/wheel-install-venv" \
            "${RUNNER_TEMP}/pi-runtime" "${RUNNER_TEMP}/opencode-runtime" "${RUNNER_TEMP}/omp-runtime"
      - name: Upload validated manylinux wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hrx-solutions-wheel-linux-x86_64
          path: build/wheel/wheelhouse/*.whl
          if-no-files-found: error
      - name: Admit completed cache snapshot
        id: cache_admit
        env:
          HRX_BAZEL_CACHE_DIR: ${{ runner.temp }}/hrx-wheel-bazel-cache
        if: inputs.use_bazel_cache && steps.cache_prepare.outputs.enabled == 'true' && github.repository == 'ROCm/hrx-solutions' && ((github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.ref == 'refs/heads/pilot/wheel-bazel-cache' && github.event_name == 'workflow_dispatch' && inputs.cache_write_pilot))
        continue-on-error: true
        run: |
          unset PYTHONPATH PYTHONHOME
          "${RUNNER_TEMP}/hem-source-venv/bin/python" build_tools/wheel_cache.py admit \
            --directory "$HRX_BAZEL_CACHE_DIR" --max-bytes 3221225472 | tee "${RUNNER_TEMP}/wheel-cache-diagnostics/admit.json"
      - name: Record attempted cache publication
        id: cache_publication
        continue-on-error: true
        if: steps.cache_admit.outputs.ready == 'true'
        run: |
          echo "key=$CACHE_KEY" >> "$GITHUB_OUTPUT"
          date +%s > "${RUNNER_TEMP}/wheel-cache-diagnostics/save.started" || true
      - name: Save optional Bazel action cache
        id: cache_save
        if: steps.cache_publication.outputs.key != ''
        continue-on-error: true
        timeout-minutes: 3
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/hrx-wheel-bazel-cache
          key: ${{ steps.cache_publication.outputs.key }}
          enableCrossOsArchive: false
      - name: Summarize optional cache
        if: always() && inputs.use_bazel_cache
        continue-on-error: true
        env:
          MATCHED_KEY: ${{ steps.cache_restore.outputs.cache-matched-key }}
          RESTORE_OUTCOME: ${{ steps.cache_restore.outcome }}
          ENABLED: ${{ steps.cache_prepare.outputs.enabled }}
          READY: ${{ steps.cache_admit.outputs.ready }}
          ATTEMPTED_KEY: ${{ steps.cache_publication.outputs.key }}
          SAVE_OUTCOME: ${{ steps.cache_save.outcome }}
        run: |
          unset PYTHONPATH PYTHONHOME
          "${RUNNER_TEMP}/hem-source-venv/bin/python" build_tools/wheel_cache_summary.py \
            --snapshot "${RUNNER_TEMP}/hrx-wheel-bazel-cache" \
            --diagnostics "${RUNNER_TEMP}/wheel-cache-diagnostics"
