name: Build and check Python wheel

on:
  workflow_call:
    inputs:
      name:
        type: string
        default: Build and check wheel (manylinux x86-64)
      release_type:
        type: string
        default: nightly
      run_id:
        type: string
        default: ""
      artifact_set:
        type: string
        default: core

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build_python_wheel:
    name: ${{ inputs.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Python test requirements
        run: |
          env -u PYTHONPATH -u PYTHONHOME python3 -m venv "${RUNNER_TEMP}/hem-source-venv"
          env -u PYTHONPATH -u PYTHONHOME "${RUNNER_TEMP}/hem-source-venv/bin/python" -m pip install \
            'setuptools>=77' 'wheel>=0.45' 'packaging>=24.2'
      - name: Run Python unit tests
        env:
          LOOM_SERVE_DIR: ${{ runner.temp }}/hem-source-state
        run: |
          unset PYTHONPATH PYTHONHOME
          python="${RUNNER_TEMP}/hem-source-venv/bin/python"
          "$python" -c 'import os,site,sys,setuptools,packaging; from pathlib import Path; assert sys.prefix != sys.base_prefix and not site.ENABLE_USER_SITE; assert "include-system-site-packages = false" in (Path(sys.prefix)/"pyvenv.cfg").read_text(); assert not os.environ.get("PYTHONPATH") and not os.environ.get("PYTHONHOME"); assert all(Path(m.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()) for m in (setuptools,packaging)); print(sys.executable, setuptools.__file__, packaging.__file__)'
          "$python" -m unittest discover -s build_tools -p '*_test.py' -v
          "$python" -m unittest discover -s tests -p '*_test.py' -v
      - name: Build and repair wheel in manylinux container
        env:
          HRX_RELEASE_TYPE: ${{ inputs.release_type }}
          HRX_RUN_ID: ${{ inputs.run_id }}
          HRX_ARTIFACT_SET: ${{ inputs.artifact_set }}
        run: bash build_tools/build-wheel.sh
      - name: Check wheel installation on Ubuntu host
        run: |
          shopt -s nullglob
          wheels=(build/wheel/wheelhouse/*.whl)
          test "${#wheels[@]}" -eq 1
          bash build_tools/check-wheel.sh "${wheels[0]}" "${RUNNER_TEMP}/wheel-install-venv"
      - name: Upload validated manylinux wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hrx-solutions-wheel-linux-x86_64
          path: build/wheel/wheelhouse/*.whl
          if-no-files-found: error
