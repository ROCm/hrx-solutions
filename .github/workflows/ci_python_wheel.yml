name: CI Python Wheel

on:
  workflow_dispatch:
    inputs:
      release_type:
        type: choice
        options:
          - nightly
          - dev
          - prerelease
        default: nightly
      run_id:
        type: string
        description: "TheRock artifact run id. Empty means latest complete Linux run."
        default: ""
      artifact_set:
        type: choice
        options:
          - core
          - core-with-llvm-dev
          - core-with-upstream-hip
        default: core
  pull_request:
  push:
    branches:
      - main
      - main-staging

permissions:
  actions: read
  contents: read

jobs:
  python_wheel:
    name: Python / manylinux wheel
    uses: ./.github/workflows/build_python_wheel.yml
    permissions:
      actions: read
      contents: read
    with:
      name: manylinux x86-64
      release_type: ${{ inputs.release_type || 'nightly' }}
      run_id: ${{ inputs.run_id || '' }}
      artifact_set: ${{ inputs.artifact_set || 'core' }}
