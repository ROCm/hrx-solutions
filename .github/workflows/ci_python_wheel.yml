name: CI Python Wheel

on:
  workflow_dispatch:
    inputs:
      use_bazel_cache:
        type: boolean
        description: "Use the optional Bazel cache (experimental; enabled by default on main pushes)."
        default: false
      cache_write_pilot:
        type: boolean
        description: "Pilot only: permit publication on pilot/wheel-bazel-cache (also enable use_bazel_cache)."
        default: false
      test_model:
        type: boolean
        description: "Run the gfx1151 Loom Control 0.8B lifecycle test after building the wheel. Pilot branch always skips this job."
        default: true
      release_type:
        type: choice
        options:
          - nightly
          - dev
          - prerelease
        default: nightly
      run_id:
        type: string
        description: "TheRock artifact run id. Empty means latest complete Linux run."
        default: ""
      artifact_set:
        type: choice
        options:
          - core
          - core-with-llvm-dev
          - core-with-upstream-hip
        default: core
  pull_request:
  push:
    branches:
      - main
      - main-staging

permissions:
  actions: read
  contents: read

jobs:
  python_wheel:
    name: Python / manylinux wheel
    uses: ./.github/workflows/build_python_wheel.yml
    permissions:
      actions: read
      contents: read
    with:
      use_bazel_cache: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.use_bazel_cache || false }}
      cache_write_pilot: ${{ inputs.cache_write_pilot || false }}
      name: manylinux x86-64
      release_type: ${{ inputs.release_type || 'nightly' }}
      run_id: ${{ inputs.run_id || '' }}
      artifact_set: ${{ inputs.artifact_set || 'core' }}

  model:
    name: Loom Control 0.8B dynamic lifecycle
    needs: python_wheel
    # Temporary pilot qualification bypass: gfx1151 startup is outside the cache gate.
    if: github.ref != 'refs/heads/pilot/wheel-bazel-cache' && (github.event_name != 'workflow_dispatch' || inputs.test_model)
    uses: ./.github/workflows/check_model.yml

  wheel_cache_cleanup:
    name: Maintain optional wheel cache
    needs: python_wheel
    if: github.repository == 'ROCm/hrx-solutions' && ((github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.ref == 'refs/heads/pilot/wheel-bazel-cache' && github.event_name == 'workflow_dispatch' && inputs.use_bazel_cache && inputs.cache_write_pilot)) && needs.python_wheel.result == 'success' && needs.python_wheel.outputs.cache_attempted_key != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout trusted cache-writer revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify publication and retire older snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPTED_KEY: ${{ needs.python_wheel.outputs.cache_attempted_key }}
          PYTHONNOUSERSITE: "1"
          CACHE_PILOT: ${{ github.ref == 'refs/heads/pilot/wheel-bazel-cache' && '1' || '0' }}
        run: |
          unset PYTHONPATH PYTHONHOME
          python3 -m venv "${RUNNER_TEMP}/wheel-cache-maintenance-venv"
          scope_args=()
          if [[ "$CACHE_PILOT" == 1 ]]; then
            scope_args+=(--pilot)
          fi
          "${RUNNER_TEMP}/wheel-cache-maintenance-venv/bin/python" build_tools/github_wheel_cache.py \
            --attempted-key "$ATTEMPTED_KEY" "${scope_args[@]}"
