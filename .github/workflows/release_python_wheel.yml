name: Release Python Wheel

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  validate_tag:
    name: Validate tag and checked-in version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install version requirements
        run: python3 -m pip install 'packaging>=24.2'
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 -m build_tools.release.publish_release validate-tag --tag "$RELEASE_TAG"

  build_python_wheel:
    name: Python / manylinux wheel
    needs: validate_tag
    uses: ./.github/workflows/build_python_wheel.yml
    permissions:
      actions: read
      contents: read
    with:
      name: Release / manylinux x86-64
      release_type: nightly
      artifact_set: core

  publish_release:
    name: Publish GitHub release
    needs: build_python_wheel
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download validated manylinux wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: hrx-solutions-wheel-linux-x86_64
          path: release-assets
      - name: Install metadata validation requirements
        run: python3 -m pip install 'twine>=6.1' 'packaging>=24.2'
      - name: Validate release assets
        run: |
          python3 -m build_tools.release.publish_release validate-wheel \
            --tag "$RELEASE_TAG" --wheel-dir release-assets
          python3 -m build_tools.wheel_tools.validate_wheel release-assets/*.whl
          python3 -m twine check --strict release-assets/*.whl
      - name: Publish GitHub release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m build_tools.release.publish_release github \
            --tag "$RELEASE_TAG" --wheel-dir release-assets

  publish_pypi:
    name: Publish to PyPI
    needs: publish_release
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/hrx-solutions/
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download the same validated wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: hrx-solutions-wheel-linux-x86_64
          path: dist
      - name: Install version requirements
        run: python3 -m pip install 'packaging>=24.2'
      - name: Check for an identical prior PyPI upload
        id: pypi
        run: python3 -m build_tools.release.publish_release pypi-status --tag "$RELEASE_TAG"
      - name: Publish wheel through trusted publishing
        if: steps.pypi.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: dist/
